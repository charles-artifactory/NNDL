[project]
name = "a1-numpy"
version = "0.1.0"
description = "Image classification with a fully connected neural network written in NumPy"
requires-python = ">=3.11,<3.12"
dependencies = ["numpy>=2.1,<3", "matplotlib>=3.9,<4"]

[dependency-groups]
dev = ["pytest>=8,<10"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project.scripts]
a1-experiment = "a1_numpy.experiment:main"
a1-report = "a1_numpy.report:main"
a1-predict = "a1_numpy.predict:main"

[tool.pytest.ini_options]
testpaths = ["tests"]
